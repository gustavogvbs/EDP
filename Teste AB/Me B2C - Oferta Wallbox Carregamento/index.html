			}

				font-size: 18px;
				line-height: 22px;
				color: #fff;
				font-weight: bold;
			}

			.wrapper_text__test h3 {
				font-size: 28px;
				line-height: 32px;
				color: #28ff52;
				font-weight: bold;
			}
		</style>
